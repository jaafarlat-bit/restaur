<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orderely – Menu digital</title>
<meta name="theme-color" content="#E4572E">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#FFF4EA;--sf:#FFFFFF;--tx:#2B1B14;--mu:#6B5649;--pr:#E4572E;--prd:#B8401C;--onpr:#2B1B14;--ac:#F6AE2D;--ln:#EBD9C8;--tint:#FDE3D6;--rd:#B3261E;--ok:#1E7B4A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Cairo,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
/* ---------- Menu client ---------- */
.hd{position:sticky;top:0;z-index:5;background:var(--pr);color:var(--onpr)}
.hd .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{margin:0;font:800 22px/1.2 Georgia,"Times New Roman",Cairo,serif;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:13px;opacity:.85}
.rlogo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.lg{display:flex;background:rgba(255,255,255,.9);border-radius:999px;padding:3px;flex:none}
.lg button{border:0;background:none;border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;color:#2B1B14}
.lg .on{background:#2B1B14;color:#fff}
.info{max-width:720px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;background:#E5F4EC;color:var(--ok)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.cl{background:#FBE4E2;color:var(--rd)}
.info a{color:var(--tx)}
.info details{width:100%}.info summary{cursor:pointer;color:var(--mu);font-weight:600}
.hlist{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;margin:6px 0 0;color:var(--mu)}.hlist .td{color:var(--tx);font-weight:700}
.closedbar{max-width:688px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:#FBE4E2;color:var(--rd);font-size:14px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;max-width:720px;margin:0 auto}
.chips button{flex:none;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:8px 18px;font-weight:600}
.chips .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;max-width:720px;margin:0 auto;padding:0 16px 16px}
.powered{text-align:center;color:var(--mu);font-size:14px;margin:0;padding:8px 16px 110px}
.card{border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:var(--sf)}
.card.off{opacity:.55}
.card img,.noimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.noimg{background:var(--tint);color:var(--prd);display:grid;place-items:center;font:800 44px/1 Georgia,"Times New Roman",Cairo,serif}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:space-between}
.cb>b{font-weight:600;line-height:1.3}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cr>span{color:var(--mu);font-weight:600;font-size:15px}
.add,.qty button{border:0;border-radius:999px;background:var(--pr);color:var(--onpr);font-weight:800}
.add{padding:6px 14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;font-size:18px}
.only{display:block;color:var(--prd);font-size:12px;font-weight:600}
.tags{font-size:12px;color:var(--mu)}
.bar{position:fixed;inset:auto 0 0 0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:14px;padding:14px 18px;background:var(--pr);color:var(--onpr);font-weight:800;text-decoration:none}
.btn.alt{background:var(--sf);border:2px solid var(--ln);color:var(--tx);margin-bottom:10px}
.btn.dis{background:var(--ln);color:var(--mu);pointer-events:none}
.back{position:fixed;inset:0;z-index:7;background:rgba(43,27,20,.55)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:8;max-height:88%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.pimg{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.lbl{margin:14px 0 6px;font-weight:700;font-size:14px;color:var(--mu)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 12px;font-weight:600}
.opt b{color:var(--mu);font-weight:600}
.opt.on{border-color:var(--pr);background:var(--tint)}
.prow{display:flex;gap:12px;align-items:center;margin-top:16px}.prow .btn{flex:1}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.line small{display:block;color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin:4px 0 12px}
textarea{min-height:64px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;color:var(--mu)}
h2{font:700 20px/1.3 Georgia,"Times New Roman",Cairo,serif;margin:0 0 10px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.msg{color:var(--rd);font-size:14px;min-height:20px;margin:0 0 8px}
.note{color:var(--mu);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{padding:14px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);font-weight:700}.pay.on{border-color:var(--pr);background:var(--tint)}
.hero{padding-top:28px}
.hero h1{font:800 34px/1.15 Georgia,"Times New Roman",Cairo,serif;margin:0 0 12px}
.hero p{color:var(--mu);margin:0 0 8px}
.logo{display:block;border-radius:28px;margin:0 0 20px}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);font-weight:600}
.tabs .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.lnk{background:none;border:0;color:var(--prd);text-decoration:underline;padding:0;font-weight:600;cursor:pointer}

/* ---------- Console du restaurateur ---------- */
body.admbody{background:#F5F5F7}
.adm{--a-tx:#101828;--a-mu:#667085;--a-ln:#EAECF0;--a-sf:#fff;--a-pr:#E4572E;--a-prs:#FDEEE9;--a-ok:#12B76A;--a-rd:#D92D20;font:15px/1.5 Inter,Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--a-tx);display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.adm input,.adm select,.adm textarea{border:1px solid #D0D5DD;border-radius:10px;padding:9px 12px;margin:6px 0 14px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:border-color .15s,box-shadow .15s}
.adm input:focus,.adm select:focus,.adm textarea:focus{outline:0;border-color:#F4A48C;box-shadow:0 0 0 4px var(--a-prs)}
.adm label{color:#344054;font-weight:500;font-size:14px}
.adm h2{font:600 18px/1.3 Inter,Cairo,sans-serif;margin:0 0 4px}
.adm h3{font-size:15px;font-weight:600;margin:18px 0 8px}
.adm .note{color:var(--a-mu);font-size:13.5px;margin:0 0 14px}
.aside{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--a-ln);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.abrand{display:flex;gap:12px;align-items:center;padding:4px 8px}
.abrand img,.abrand .av{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--a-prs);color:var(--a-pr);display:grid;place-items:center;font-weight:700;flex:none}
.abrand b{display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}.abrand small{color:var(--a-mu)}
.anav{display:flex;flex-direction:column;gap:2px;flex:1}
.anav button{display:flex;gap:12px;align-items:center;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:500;color:#344054;text-align:start}
.anav button:hover{background:#F9FAFB}
.anav button.on{background:var(--a-prs);color:#B93815}
.amain{min-width:0;padding:0 32px 60px}
.ahd{position:sticky;top:0;z-index:4;background:rgba(245,245,247,.85);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0 14px;margin-bottom:6px}
.ahd h1{font:700 24px/1.2 Inter,Cairo,sans-serif;margin:0;letter-spacing:-.02em}
.st{margin:2px 0 0;color:var(--a-mu);font-size:13px}.st.bad{color:var(--a-rd)}
.ahd-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.apanel{display:flex;flex-direction:column;gap:16px;max-width:860px}
.acard{background:var(--a-sf);border:1px solid var(--a-ln);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--a-pr);background:var(--a-pr);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.ab:hover{filter:brightness(.95)}
.ab.sec{background:#fff;color:#344054;border-color:#D0D5DD}
.ab.ghost{background:transparent;border-color:transparent;color:#475467;box-shadow:none}.ab.ghost:hover{background:#F2F4F7}
.ab.danger{background:#fff;color:var(--a-rd);border-color:#FDA29B}
.ab.sm{padding:6px 10px;font-size:13px}
.ab.full{width:100%}
.atool{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid #D0D5DD;background:#fff;border-radius:999px;padding:6px 14px;font-weight:500;font-size:13.5px;color:#344054}
.fchips button.on{background:var(--a-tx);color:#fff;border-color:var(--a-tx)}
.cath{display:flex;align-items:center;gap:8px;margin:10px 4px 2px;color:var(--a-mu);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{background:#fff;border:1px solid var(--a-ln);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:box-shadow .15s}
.drow.open{box-shadow:0 8px 24px rgba(16,24,40,.08);border-color:#F4C7B8}
.dmain{display:flex;align-items:center;gap:12px;padding:10px 12px}
.dmove{display:flex;flex-direction:column}
.dmove button{border:0;background:none;color:#98A2B3;font-size:11px;line-height:1;padding:3px 4px;border-radius:6px}.dmove button:hover{background:#F2F4F7;color:var(--a-tx)}
.dth{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:#F2F4F7;display:grid;place-items:center;color:#98A2B3;font-size:20px}
.dinfo{flex:1;min-width:0}.dinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dinfo small{color:var(--a-mu);font-size:13px}
.pills{display:inline-flex;gap:4px;flex-wrap:wrap;margin-inline-start:6px}
.pills i{font-style:normal;font-size:11.5px;font-weight:600;background:#F2F4F7;color:#475467;border-radius:999px;padding:1px 8px}
.pills i.w{background:#FEF0C7;color:#93370D}
.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none;margin:0}
.sw input{position:absolute;opacity:0;width:0;height:0;margin:0}
.sw span{position:absolute;inset:0;background:#D0D5DD;border-radius:999px;transition:.2s;cursor:pointer}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2);transition:.2s}
.sw input:checked+span{background:var(--a-ok)}.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid var(--a-tx);outline-offset:2px}
.ded{border-top:1px solid var(--a-ln);padding:16px;display:grid;grid-template-columns:120px 1fr;gap:18px}
.ph{display:block;cursor:pointer;text-align:center}
.ph img,.ph .noph{width:120px;height:120px;border-radius:14px;object-fit:cover;background:#F9FAFB;border:1px dashed #D0D5DD;display:grid;place-items:center;color:#98A2B3;font-size:28px}
.ph small{display:block;color:#B93815;font-weight:600;font-size:13px;margin-top:6px}.ph input{display:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2a{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blk{border:1px solid var(--a-ln);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#FCFCFD}
.blk h4{margin:0 0 2px;font-size:14px;font-weight:600}.blk p{margin:0 0 8px;color:var(--a-mu);font-size:13px}
.kv{display:flex;gap:8px;align-items:center}.kv input{margin:4px 0}.kv input[type=number]{max-width:110px}
.tagl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tagl span{display:inline-flex;align-items:center;gap:6px;background:var(--a-prs);color:#B93815;border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.tagl span button{border:0;background:rgba(0,0,0,.06);border-radius:50%;width:20px;height:20px;line-height:1;color:inherit}
.preset{display:flex;flex-wrap:wrap;gap:6px}.preset button{border:1px dashed #D0D5DD;background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;color:#475467}
.days{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dy{border:1px solid #D0D5DD;background:#fff;border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:500}
.dy.on{background:var(--a-pr);color:#fff;border-color:var(--a-pr)}
.days small{color:var(--a-mu);margin-inline-start:6px}
.dfoot{display:flex;justify-content:space-between;gap:8px;grid-column:1/-1;border-top:1px solid var(--a-ln);padding-top:12px}
.crow{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--a-ln)}.crow input{margin:0}
.cnt{color:var(--a-mu);font-size:13px;white-space:nowrap}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
.swc{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #D0D5DD}.swc.on{box-shadow:0 0 0 2px var(--a-tx)}
.sws input[type=color]{width:42px;height:34px;padding:2px;margin:0}
.lgo{display:flex;gap:16px;align-items:center;margin:8px 0 14px}.lgo img,.lgo .noph{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#F9FAFB;border:1px dashed #D0D5DD;display:grid;place-items:center;color:#98A2B3}
.hr7{display:grid;grid-template-columns:110px auto 1fr auto 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--a-ln)}.hr7 input{margin:0}.hr7 .off{color:var(--a-mu);font-size:13px;grid-column:3/6}
.copy{display:flex;gap:8px}.copy input{margin:0}
.qrbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:16px}
#qr{padding:12px;background:#fff;border:1px solid var(--a-ln);border-radius:14px;display:inline-block}
.wa{max-width:340px;background:#E7FFDB;border-radius:12px;padding:6px;font-size:13px}
.wa .wc{background:#fff;border-radius:8px;overflow:hidden;display:flex}.wa img{width:84px;height:84px;object-fit:cover}
.wa .wt{padding:8px 10px;min-width:0}.wa b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wa small{color:#667085;display:block}
.wa p{margin:6px 4px 2px;color:#027EB5;word-break:break-all}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.kpi div{background:#fff;border:1px solid var(--a-ln);border-radius:14px;padding:14px;color:var(--a-mu);font-size:13px}
.kpi b{display:block;font-size:24px;color:var(--a-tx);letter-spacing:-.02em}
.hrow{padding:10px 0;border-bottom:1px solid var(--a-ln)}
.hrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}.hrow .top span{color:var(--a-mu)}
.pbar{display:flex;align-items:center;gap:10px;margin-top:6px}
.pbar span{flex:1;height:8px;background:#F2F4F7;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#F97A54,var(--a-pr));border-radius:99px}
.pbar small{min-width:40px;text-align:end;font-weight:700;color:#B93815}
details.tbh{border-bottom:1px solid var(--a-ln)}details.tbh summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ses{padding:4px 0 12px;font-size:14px;color:var(--a-mu)}.ses b{color:var(--a-tx)}
.seg{display:inline-flex;background:#F2F4F7;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:500;color:#475467}.seg button.on{background:#fff;color:var(--a-tx);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.amsg{font-size:14px;margin:4px 0 0;min-height:20px}.amsg.ok{color:#027A48}.amsg.bad{color:var(--a-rd)}
.dz{border-color:#FECDCA}.dz h2{color:var(--a-rd)}
@media (max-width:900px){
 .adm{grid-template-columns:1fr}
 .aside{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--a-ln);overflow-x:auto}
 .abrand small,.aside>.ab{display:none}.abrand b{max-width:110px}
 .anav{flex-direction:row;gap:4px}.anav button{white-space:nowrap;padding:8px 10px;font-size:14px}.anav button svg{display:none}
 .amain{padding:0 14px 60px}.ahd{position:static;padding:16px 0 8px}.ahd h1{font-size:20px}
 .ded{grid-template-columns:1fr}.ph{text-align:start}.g3{grid-template-columns:1fr}
 .crow{grid-template-columns:auto 1fr auto;}.crow input[data-c=en],.crow input[data-c=ar]{grid-column:2/3}
 .hr7{grid-template-columns:80px auto 1fr auto 1fr;gap:6px}
 .kpi b{font-size:19px}
}
@media print{.aside,.ahd,.acard:not(.qrc){display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},lsr=k=>{try{localStorage.removeItem(k)}catch(e){}};
const DEF_CATS=[{id:'ent',fr:'Entrées',ar:'المقبلات',en:'Starters'},{id:'pla',fr:'Plats',ar:'الأطباق',en:'Mains'},{id:'des',fr:'Desserts',ar:'الحلويات',en:'Desserts'},{id:'boi',fr:'Boissons',ar:'المشروبات',en:'Drinks'}];
const STAR='<svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="#FFF4EA" stroke-width="4.5"/><path d="M13 20.5l5 5 9-11" fill="none" stroke="#F6AE2D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LOGO='/logo.png';
const api=async(u,m,b)=>{const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(lsg('tk')||'')},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j};
const slugify=v=>v.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const mix=(a,b,t)=>'#'+a.map((c,i)=>Math.round(c+(b[i]-c)*t).toString(16).padStart(2,'0')).join('');
const brand=col=>{if(!/^#[0-9a-f]{6}$/i.test(col||''))return;const c=hx(col),s=document.documentElement.style;s.setProperty('--pr',col);s.setProperty('--prd',mix(c,[0,0,0],.3));s.setProperty('--tint',mix(c,[255,255,255],.85));s.setProperty('--onpr',lum(c)>.35?'#1A1A1A':'#FFFFFF');const m=$('meta[name=theme-color]');if(m)m.content=col};
/* Horaires : {0:{o:'12:00',c:'23:00'} | null, …} ; fermeture après minuit acceptée (ex. 18:00 → 02:00). */
const toM=s=>{const p=s.split(':');return +p[0]*60+ +p[1]};
function openStatus(H){
 if(!H||Object.keys(H).length<7)return null;
 const n=new Date(),d=n.getDay(),m=n.getHours()*60+n.getMinutes(),g=k=>H[(k+7)%7];
 const r=g(d),y=g(d-1);
 if(y&&toM(y.c)<toM(y.o)&&m<toM(y.c))return{open:true,at:y.c};
 if(r){const o=toM(r.o),c=toM(r.c);if(o===c||(c>o?m>=o&&m<c:m>=o))return{open:true,at:o===c?'':r.c};if(m<o)return{open:false,at:r.o,k:0}}
 for(let k=1;k<=7;k++){const x=g(d+k);if(x)return{open:false,at:x.o,k}}
 return{open:false,at:'',k:-1};
}

/* Réduit une photo à ~100 Ko max (taille max en px, puis baisse de qualité/taille jusqu'à passer sous la limite). */
async function resize(file,maxPx){const im=await createImageBitmap(file);let max=maxPx||900,q=.82,d='';for(let n=0;n<10;n++){const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if((d.length-23)*.75<=100e3)break;if(q>.6)q-=.08;else max=Math.round(max*.85)}return d}

 const tkey=s=>{const m=String(s||'').match(/\d+/);return m?m[0]:(String(s||'').trim()||'?')};
 const hm=t=>{const d=new Date(t);return(HP>1?d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' ':'')+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};

 const loadHist=async()=>{
  const from=HP===1?new Date().setHours(0,0,0,0):Date.now()-HP*864e5;
  let ev;try{ev=await api('/api/orders?from='+from)}catch(e){HH='<p class="amsg bad">Impossible de charger l’historique.</p>';const h=$('#hist');if(h)h.innerHTML=HH;return}
  const ses={};for(const o of ev){const s=ses[o.sid]=ses[o.sid]||{t:o.t,table:o.table,lines:[],total:0,bill:null,notes:[]};
   if(o.table)s.table=o.table;if(o.kind==='bill')s.bill=o;else{s.total+=o.total;s.lines.push(...o.lines);if(o.note)s.notes.push(o.note)}}
  const list=Object.values(ses).filter(s=>s.total>0).sort((a,b)=>b.t-a.t),ca=list.reduce((a,s)=>a+s.total,0);
  const dish={};for(const o of ev)if(o.kind==='order')for(const l of o.lines){const k=l.id+'|'+(l.sz||''),d=dish[k]=dish[k]||{fr:l.fr+(l.sz?' ('+l.sz+')':''),q:0,ca:0};d.q+=l.q;d.ca+=l.q*l.p}
  const ds=Object.values(dish).sort((a,b)=>b.q-a.q||b.ca-a.ca),tq=ds.reduce((a,d)=>a+d.q,0)||1;
  const tabs={};for(const s of list)(tabs[tkey(s.table)]=tabs[tkey(s.table)]||[]).push(s);
  const tk=Object.keys(tabs).sort((a,b)=>(+a||1e9)-(+b||1e9)||a.localeCompare(b));
  HH=!list.length?'<p class="note" style="margin-top:14px">Aucune commande sur cette période.</p>':
   `<div class="kpi"><div><b>${list.length}</b>commandes</div><div><b>${ca} MAD</b>chiffre d’affaires</div><div><b>${Math.round(ca/list.length)} MAD</b>panier moyen</div></div>`+
   `<h3>Plats les plus vendus</h3>`+ds.map(d=>{const p=Math.round(d.q/tq*100);return`<div class="hrow"><div class="top"><b>${esc(d.fr)}</b><span>${d.q} vendu${d.q>1?'s':''} · ${d.ca} MAD</span></div><div class="pbar" aria-label="${p} % des plats vendus"><span><i style="width:${p}%"></i></span><small>${p} %</small></div></div>`}).join('')+
   `<h3 style="margin-top:22px">Par table</h3>`+tk.map(k=>{const ss=tabs[k],tt=ss.reduce((a,s)=>a+s.total,0);return`<details class="tbh"><summary><span>${k==='?'?'Table non indiquée':'Table '+esc(k)}</span><span>${ss.length} commande${ss.length>1?'s':''} · ${tt} MAD</span></summary>${ss.map(s=>`<div class="ses"><b>${hm(s.t)} · ${s.total} MAD</b> — ${s.bill?'Addition demandée ('+(s.bill.pay==='cb'?'carte':'espèces')+')':'En cours'}<br>${s.lines.map(ln).join(', ')}${s.notes.length?'<br>Remarque : « '+esc(s.notes.join(' / '))+' »':''}</div>`).join('')}</details>`}).join('');
  const h=$('#hist');if(h)h.innerHTML=HH};
 /* --- Onglet Compte --- */
 const pCompte=()=>`<div class="acard"><h2>Identifiants et lien</h2><p class="note">Pour toute modification, saisissez votre mot de passe actuel. Si vous changez de lien, l’ancien continue de fonctionner : vos QR codes imprimés restent valables.</p>

 const render=()=>{

 const msg=(id,t,ok)=>{const e=$('#'+id);if(e){e.textContent=t;e.className='amsg '+(ok?'ok':'bad')}};
 const moveIn=(arr,i,dir,same)=>{let j=i+dir;while(j>=0&&j<arr.length&&!same(arr[j]))j+=dir;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true};

 A.onclick=async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){TAB=tb.dataset.tab;lss('atab',TAB);render();scrollTo(0,0);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,i=id&&it(id),ix=+b.dataset.ix,v=b.dataset.v;
  if(a==='out'){lsr('tk');location.href='/';return}
  if(a==='fcat'){FCAT=v;render();return}
  if(a==='edit'){OPEN=OPEN===id?null:id;render();return}
  if(a==='new'){const n={id:uid(),cat:FCAT!=='all'?FCAT:cats()[0].id,fr:'',ar:'',en:'',price:0,on:true,img:'',days:[],sizes:[],opts:[],extras:[]};R.items.unshift(n);OPEN=n.id;render();await saveItems();const f=$(`[data-k="fr"][data-id="${n.id}"]`);if(f)f.focus();return}
  if(a==='up'||a==='down'){const k=R.items.indexOf(i);if(moveIn(R.items,k,a==='up'?-1:1,x=>x.cat===i.cat)){render();saveItems()}return}
  if(a==='del'){if(!confirm('Supprimer « '+(i.fr||'ce plat')+' » ?'))return;R.items=R.items.filter(x=>x!==i);OPEN=null;render();saveItems();return}
  if(a==='day'){const d=+v,s=new Set(i.days||[]);s.has(d)?s.delete(d):s.add(d);i.days=[...s]}
  else if(a==='szmg'){i.sizes=[{n:'Moyen',p:i.price},{n:'Grand',p:i.price}]}
  else if(a==='szadd'){i.sizes=[...(i.sizes||[]),{n:(i.sizes||[]).length?'':'Moyen',p:i.price}]}
  else if(a==='szdel'){i.sizes.splice(ix,1)}
  else if(a==='opadd'){i.opts=[...(i.opts||[]),v]}
  else if(a==='opnew'){const f=$('#opn-'+id),t=f&&f.value.trim();if(!t)return;i.opts=[...(i.opts||[]),t]}
  else if(a==='opdel'){i.opts.splice(ix,1)}
  else if(a==='exadd'){i.extras=[...(i.extras||[]),{n:v||'Supplément',p:0}]}
  else if(a==='exdel'){i.extras.splice(ix,1)}
  else if(a==='cup'||a==='cdown'){const c=[...cats()];if(moveIn(c,ix,a==='cup'?-1:1,()=>true)&&await saveMe({cats:c}))render();return}
  else if(a==='cadd'){const c=[...cats(),{id:Math.random().toString(36).slice(2,8),fr:'Nouvelle catégorie',en:'',ar:''}];if(await saveMe({cats:c}))render();return}
  else if(a==='cdel'){const c=cats(),n=R.items.filter(x=>x.cat===c[ix].id).length,to=c.find((x,k)=>k!==ix);if(n&&!confirm(`Les ${n} plat(s) de « ${c[ix].fr} » seront déplacés dans « ${to.fr} ». Continuer ?`))return;if(await saveMe({cats:c.filter((x,k)=>k!==ix)}))render();return}
  else if(a==='col'){if(await saveMe({color:v}))render();return}
  else if(a==='nologo'){if(await saveMe({logo:''}))render();return}
  else if(a==='hon'){const h={};for(let d=0;d<7;d++)h[d]={o:'12:00',c:'23:00'};if(await saveMe({hours:h}))render();return}
  else if(a==='hoff'){if(await saveMe({hours:{}}))render();return}
  else if(a==='copy'){try{await navigator.clipboard.writeText(url());b.textContent='Copié ✓'}catch(x){$('#ul').select()}return}
  else if(a==='qrdl'){const d=document.createElement('div');new QRCode(d,{text:url(),width:1024,height:1024});const c=d.querySelector('canvas');if(c){const l=document.createElement('a');l.href=c.toDataURL('image/png');l.download='qr-'+R.slug+'.png';l.click()}return}
  else if(a==='hp'){HP=+v;document.querySelectorAll('#hp button').forEach(x=>x.classList.toggle('on',x===b));const h=$('#hist');if(h)h.innerHTML='<p class="note">Chargement…</p>';loadHist();return}
  else if(a==='exp'){try{const r=await fetch('/api/export',{headers:{Authorization:'Bearer '+lsg('tk')}});if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob()),l=document.createElement('a');l.href=u;l.download='seed.json';l.click();URL.revokeObjectURL(u);st('Sauvegarde téléchargée ✓')}catch(x){st('Échec de la sauvegarde',1)}return}
  else if(a==='imp'){$('#imp').click();return}
  else if(a==='acc'){const pw=$('#ap').value;if(!pw){msg('am','Saisissez votre mot de passe actuel.');$('#ap').focus();return}
   try{R=await api('/api/account','POST',{password:pw,email:$('#ae').value.trim(),slug:$('#as').value.trim(),newPassword:$('#an').value});render();msg('am','Modifications enregistrées ✓',1)}
   catch(x){msg('am',{pw:'Mot de passe actuel incorrect.',email:'Email invalide.',emailused:'Cet email est déjà utilisé.',slug:'Lien invalide (lettres, chiffres, tirets).',slugused:'Ce lien est déjà pris. Choisissez-en un autre.',newpw:'Nouveau mot de passe : 6 caractères minimum.',many:'Trop d’essais. Réessayez dans 15 minutes.'}[x.error]||'Une erreur est survenue.')}return}
  else if(a==='accdel'){const pw=$('#dp').value;if(!pw){msg('dm','Saisissez votre mot de passe.');return}if(!confirm('Supprimer définitivement le compte « '+R.name+' » ? Cette action est irréversible.'))return;
   try{await api('/api/account','DELETE',{password:pw});lsr('tk');location.href='/'}catch(x){msg('dm',x.error==='pw'?'Mot de passe incorrect.':'Une erreur est survenue.')}return}
  else return;
  render();saveItems()};

 A.onchange=async e=>{const t=e.target,id=t.dataset.id,i=id&&it(id),ix=+t.dataset.ix;
  if(t.id==='imp'){const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw 0;if(!confirm('Remplacer le menu actuel par cette sauvegarde ('+d.items.length+' plats) ?')){t.value='';return}st('Restauration en cours…');R=await api('/api/import','POST',d);render();st('Menu restauré ✓')}catch(x){t.value='';st('Fichier de sauvegarde invalide',1)}return}
  if(t.id==='logo'){const f=t.files[0];if(!f)return;st('Envoi du logo…');try{const im=(await api('/api/photo','POST',{data:await resize(f,400)})).img;if(await saveMe({logo:im}))render()}catch(x){st('Image refusée',1)}return}
  if(['gn','gw','ga','gi','gr'].includes(t.id)){await saveMe({name:$('#gn').value.trim(),wa:$('#gw').value.trim(),addr:$('#ga').value.trim(),ig:$('#gi').value.trim(),review:$('#gr').value.trim()});$('#gi').value=R.ig||'';$('#gr').value=R.review||'';return}
  if(t.id==='gc'){if(await saveMe({color:t.value}))render();return}
  if(t.dataset.h){const h=JSON.parse(JSON.stringify(H())),d=t.dataset.d;if(t.dataset.h==='on')h[d]=t.checked?{o:'12:00',c:'23:00'}:null;else if(h[d])h[d][t.dataset.h]=t.value;if(await saveMe({hours:h})&&t.dataset.h==='on')render();return}
  if(t.dataset.c){const c=cats().map(x=>Object.assign({},x));c[ix][t.dataset.c]=t.value.trim();if(await saveMe({cats:c})&&TAB!=='cats')render();return}
  if(!i)return;
  if(t.type==='file'){if(!t.files[0])return;st('Envoi de la photo…');try{i.img=(await api('/api/photo','POST',{data:await resize(t.files[0])})).img}catch(x){st('Photo refusée',1);return}render()}
  else if(t.dataset.sz){i.sizes[ix][t.dataset.sz]=t.dataset.sz==='p'?Number(t.value)||0:t.value}
  else if(t.dataset.ex){i.extras[ix][t.dataset.ex]=t.dataset.ex==='p'?Number(t.value)||0:t.value}
  else if(t.dataset.k==='on'){i.on=t.checked;t.closest('.sw').title=i.on?'Disponible':'Épuisé'}
  else if(t.dataset.k){i[t.dataset.k]=t.dataset.k==='price'?Number(t.value)||0:t.value;if(t.dataset.k==='cat')render()}
  await saveItems()};
 render();
}

/* ---------- Menu client ---------- */
async function menuPage(slug){
 let R;try{R=await api('/api/menu/'+encodeURIComponent(slug))}catch(e){A.innerHTML='<p class="empty">'+TT.fr.nf+'</p>';return}
 R.items=R.items.filter(i=>i.fr||i.ar||i.en);R.cats=R.cats&&R.cats.length?R.cats:DEF_CATS;
 document.title=R.name;brand(R.color);
 /* Commande envoyée (« en cours ») : gardée sur le téléphone 12 h, jusqu'à la demande d'addition. */
 const OK='ord_'+R.slug,keep=()=>{S.done?lss(OK,JSON.stringify(Object.assign(S.done,{nm:S.nm,pay:S.pay}))):lsr(OK)};
 let saved=null;try{saved=JSON.parse(lsg(OK)||'null');if(saved&&(Date.now()-saved.ts>12*3600e3||!saved.sid))saved=null}catch(e){}
 const nl=(navigator.language||'').slice(0,2),lg0=lsg('lg');
 const S={lang:['fr','en','ar'].includes(lg0)?lg0:['en','ar'].includes(nl)?nl:'fr',cat:'',cart:[],sheet:false,pick:null,nm:saved?saved.nm||'':'',step:'',pay:saved?saved.pay||'':'',done:saved,onote:''};
 S.cat=(R.cats.find(c=>R.items.some(i=>i.cat===c.id))||R.cats[0]).id;
 const t=k=>TT[S.lang][k]||TT.fr[k],L=o=>S.lang==='ar'?o.ar||o.fr||o.en:S.lang==='en'?o.en||o.fr||o.ar:o.fr||o.en||o.ar;
 const nm=i=>L(i)||'?',mad=n=>S.lang==='ar'?n+' د.م':n+' MAD',item=id=>R.items.find(i=>i.id===id);
 const cfgd=i=>(i.sizes||[]).length||(i.opts||[]).length||(i.extras||[]).length;
 const unit=l=>{const i=item(l.id);if(!i)return l.p||0;const sz=(i.sizes||[])[l.s];return(sz?sz.p:i.price)+(l.e||[]).reduce((a,k)=>a+(((i.extras||[])[k]||{}).p||0),0)};
 const lname=l=>{const i=item(l.id),sz=i&&(i.sizes||[])[l.s];return(i?nm(i):'?')+(sz?' ('+tr(sz.n)+')':'')};
 const ldet=l=>{const i=item(l.id);if(!i)return'';const a=[...(l.o||[]).map(k=>tr((i.opts||[])[k])),...(l.e||[]).map(k=>'+ '+tr(((i.extras||[])[k]||{}).n))].filter(x=>x&&x!=='+ undefined');if(l.n)a.push('« '+l.n+' »');return a.join(' · ')};
 const keyOf=l=>[l.id,l.s,(l.o||[]).join('.'),(l.e||[]).join('.'),l.n||''].join('|');
 const cnt=()=>S.cart.reduce((a,l)=>a+l.q,0),sum=()=>S.cart.reduce((a,l)=>a+l.q*unit(l),0),qtyOf=id=>S.cart.filter(l=>l.id===id).reduce((a,l)=>a+l.q,0);
 const addLine=l=>{l.k=keyOf(l);const x=S.cart.find(y=>y.k===l.k);x?x.q+=l.q:S.cart.push(l)};
 const prev=()=>S.done?S.done.total:0,asked=()=>!!(S.done&&S.done.asked);
 let ST=openStatus(R.hours);const closed=()=>!!(ST&&!ST.open),canOrder=i=>avail(i)&&!closed();
 /* Numéro de table obligatoire (celui du chevalet) : sans lui, on bloque l'envoi et on affiche un message. */
 const field=()=>`<label for="nm" style="margin-top:14px">${t('who')} *</label><input id="nm" value="${esc(S.nm)}" autocomplete="off" required aria-describedby="nmerr"><p class="msg" id="nmerr" role="alert"></p>`;
 const noTable=e=>{if(S.nm.trim())return false;e.preventDefault();const m=$('#nmerr'),f=$('#nm');if(m)m.textContent=t('tblerr');if(f)f.focus();return true};
 const post=b=>{try{fetch('/api/order/'+encodeURIComponent(R.slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),keepalive:true}).catch(()=>{})}catch(e){}};
 const linksH=()=>(R.review?`<a class="btn alt" href="${esc(R.review)}" target="_blank" rel="noopener"><span>${t('review')}</span></a>`:'')+(R.ig?`<a class="btn alt" href="${esc(R.ig)}" target="_blank" rel="noopener"><span>${t('follow')}</span></a>`:'');
 const num=()=>R.wa.replace(/\D/g,'');
 const msgLines=()=>S.cart.map(l=>{const d=ldet(l);return l.q+' × '+lname(l)+' — '+mad(l.q*unit(l))+(d?'\n   '+d:'')}).join('\n');
 const link=()=>'https://wa.me/'+num()+'?text='+encodeURIComponent(R.name+(prev()?'\n'+t('addmsg'):'')+'\n'+msgLines()+'\n'+(prev()?t('prev')+' : '+mad(prev())+'\n'+t('newt')+' : '+mad(prev()+sum()):t('total')+' : '+mad(sum()))+(S.onote.trim()?'\n'+t('notelbl')+' : '+S.onote.trim():'')+(S.nm?'\n'+t('ml')+' : '+S.nm:''));
 const billLink=()=>'https://wa.me/'+num()+'?text='+encodeURIComponent(R.name+'\n'+t('billmsg')+'\n'+(S.nm?t('ml')+' : '+S.nm+'\n':'')+t('pay')+' : '+(S.pay==='cb'?t('cbmsg'):t('cashmsg'))+'\n'+t('total')+' : '+mad(prev()));
 const step=(v,q)=>`<div class="qty"><button data-a="sub" data-v="${v}" aria-label="−">−</button><b>${q}</b><button data-a="add" data-v="${v}" aria-label="+">+</button></div>`;
 const statusTxt=()=>{if(!ST)return'';LANG=S.lang;if(ST.open)return t('open')+(ST.at?' · '+t('closes')+' '+t('at')+' '+ST.at:' · '+t('allday'));if(ST.k<0)return t('closed');return t('closed')+' · '+t('opens')+(ST.k===1?' '+t('tomorrow'):ST.k>1?' '+DN[S.lang][(today()+ST.k)%7]:'')+' '+t('at')+' '+ST.at};
 const infoH=()=>{const H=R.hours&&Object.keys(R.hours).length===7?R.hours:null;if(!H&&!R.addr)return'';
  return`<div class="info">${ST?`<span class="badge ${ST.open?'':'cl'}">${esc(statusTxt())}</span>`:''}${R.addr?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(R.addr)}" target="_blank" rel="noopener">📍 ${esc(R.addr)}</a>`:''}${H?`<details><summary>${t('hours')}</summary><div class="hlist">${WK.map(d=>`<span class="${d===today()?'td':''}">${DN[S.lang][d]}</span><span class="${d===today()?'td':''}">${H[d]?(H[d].o===H[d].c?t('allday'):H[d].o+' – '+H[d].c):t('dayoff')}</span>`).join('')}</div></details>`:''}</div>${closed()?`<p class="closedbar" role="status">${t('closedmsg')}</p>`:''}`};
 const doneLines=()=>S.done.lines.map(l=>{const d=ldet(l);return`<div class="line"><div><b>${l.q} × ${esc(lname(l))}</b>${d?`<small>${esc(d)}</small>`:''}</div><span>${mad(l.q*l.p)}</span></div>`}).join('');
 const afterV=()=>{
  const okc=S.pay&&num().length>6;
  const pay=`<div class="g2"><button class="pay ${S.pay==='cb'?'on':''}" data-a="pay" data-v="cb">${t('cb')}</button><button class="pay ${S.pay==='cash'?'on':''}" data-a="pay" data-v="cash">${t('cash')}</button></div>`;
  const ask=asked()?`<p><b>${t('asked')}</b> ${S.pay==='cb'?t('askedcb'):t('askedcash')}</p>`:`${S.pay?'':`<p class="note">${t('pickpay')}</p>`}<a id="call" data-a="called" class="btn ${okc?'':'dis'}" href="${okc?billLink():'#'}" target="_blank" rel="noopener"><span>${t('call')}</span></a>`;
  const links=linksH();
  const next=asked()?`<h2 style="margin-top:24px">${t('thanks')}</h2>${links}<button class="btn" data-a="quit" style="margin-bottom:10px"><span>${t('quit')}</span></button><button class="btn alt" data-a="again"><span>${t('again')}</span></button>`:`<button class="btn alt" data-a="more" style="margin-top:14px"><span>${t('more')}</span></button><p class="note">${t('lockd')}</p>${links?`<h2 style="margin-top:24px">${t('thanks')}</h2>${links}`:''}`;
  return`<div class="back" data-a="close2"></div><div class="sheet" role="dialog" aria-label="${t('cur')}">${S.justSent?`<h2>${t('sent')}</h2><p class="note">${t('sentd')}</p>`:''}<h2 style="margin-top:12px">${t('cur')}</h2>${doneLines()}<div class="line"><b>${t('total')}</b><b>${mad(prev())}</b></div><h2 style="margin-top:20px">${t('bill')}</h2>${asked()?'':`<p class="note">${t('billd')}</p>${pay}${field()}`}${ask}${next}</div>`};
 /* Fiche du plat : taille, options, suppléments, remarque, quantité. */
 const pickV=()=>{const P=S.pick,i=item(P.id),img=i.img?'/img/'+i.img:i.ph;
  return`<div class="back" data-a="pclose"></div><div class="sheet" role="dialog" aria-label="${esc(nm(i))}">${img?`<img class="pimg" src="${img}" alt="">`:''}<h2>${esc(nm(i))}</h2>
  ${(i.sizes||[]).length?`<p class="lbl">${t('size')}</p><div class="opts" role="radiogroup">${i.sizes.map((s,k)=>`<button class="opt ${P.s===k?'on':''}" data-a="psz" data-v="${k}" role="radio" aria-checked="${P.s===k}"><span>${esc(tr(s.n))}</span><b>${mad(s.p)}</b></button>`).join('')}</div>`:''}
  ${(i.opts||[]).length?`<p class="lbl">${t('opts')}</p><div class="opts">${i.opts.map((o,k)=>`<button class="opt ${P.o.includes(k)?'on':''}" data-a="pop" data-v="${k}" aria-pressed="${P.o.includes(k)}">${P.o.includes(k)?'✓ ':''}${esc(tr(o))}</button>`).join('')}</div>`:''}
  ${(i.extras||[]).length?`<p class="lbl">${t('extras')}</p><div class="opts">${i.extras.map((x,k)=>`<button class="opt ${P.e.includes(k)?'on':''}" data-a="pex" data-v="${k}" aria-pressed="${P.e.includes(k)}"><span>${P.e.includes(k)?'✓ ':''}${esc(tr(x.n))}</span><b>+${mad(x.p)}</b></button>`).join('')}</div>`:''}
  <label for="pn" style="margin-top:14px">${t('note')}</label><input id="pn" value="${esc(P.n)}" placeholder="${t('notep')}" maxlength="140">
  <div class="prow"><div class="qty"><button data-a="pq" data-v="-1" aria-label="−">−</button><b>${P.q}</b><button data-a="pq" data-v="1" aria-label="+">+</button></div><button class="btn" data-a="padd"><span>${t('add')}</span><span>${mad(P.q*unit(P))}</span></button></div></div>`};
 const draw=()=>{
  LANG=S.lang;ST=openStatus(R.hours);
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const head=`<div class="hd"><div class="in"><div class="brand">${R.logo?`<img class="rlogo" src="/img/${R.logo}" alt="">`:STAR}<div><h1>${esc(R.name)}</h1><p>${t('sub')}</p></div></div><div class="lg" role="group" aria-label="Langue">${[['fr','FR'],['en','EN'],['ar','ع']].map(l=>`<button data-a="lang" data-v="${l[0]}" class="${S.lang===l[0]?'on':''}" aria-pressed="${S.lang===l[0]}">${l[1]}</button>`).join('')}</div></div></div>`;
  if(S.step==='bye'){A.innerHTML=head+`<div class="wrap hero"><h1>${t('bye')}</h1><p>${t('byed')}</p>${linksH()}<button class="btn alt" data-a="back"><span>${t('back')}</span></button></div>`;return}
  const chips=R.cats.filter(c=>R.items.some(i=>i.cat===c.id)).map(c=>`<button data-a="cat" data-v="${c.id}" class="${S.cat===c.id?'on':''}">${esc(L(c))}</button>`).join('');
  const cards=R.items.filter(i=>i.cat===S.cat).map(i=>{const q=qtyOf(i.id),sz=i.sizes||[];
   const ctl=!avail(i)?`<small>${t('off')}</small>`:closed()?`<small>${t('closed')}</small>`:cfgd(i)?`<button class="add" data-a="add" data-v="${i.id}">${q?q+' · ':''}${t('add')}</button>`:q?step(i.id,q):`<button class="add" data-a="add" data-v="${i.id}">${t('add')}</button>`;
   const tags=[sz.length?sz.map(s=>tr(s.n)).join(' / '):'',(i.extras||[]).length?t('extras'):''].filter(Boolean).join(' · ');
   return`<article class="card ${canOrder(i)?'':'off'}">${i.img||i.ph?`<img src="${i.img?'/img/'+i.img:i.ph}" alt="" loading="lazy">`:`<div class="noimg">${esc([...nm(i)][0]||'?')}</div>`}<div class="cb"><b>${esc(nm(i))}</b>${hasDays(i)&&i.on?`<span class="only">${esc(onlyTxt(i,S.lang))}</span>`:''}${tags?`<span class="tags">${esc(tags)}</span>`:''}<div class="cr"><span>${sz.length?t('from')+' '+mad(Math.min(...sz.map(s=>s.p))):mad(i.price)}</span>${ctl}</div></div></article>`}).join('');
  const bar=cnt()?`<div class="bar"><button class="btn" data-a="sheet"><span>${t('view')} (${cnt()})</span><span>${mad(prev()+sum())}</span></button></div>`:S.done?`<div class="bar"><button class="btn" data-a="open2"><span>${t('mine')}</span><span>${mad(prev())}</span></button></div>`:'';
  const ok=num().length>6&&cnt()&&!closed();
  const prevBox=prev()?`<div class="line"><span class="note">${t('prev')}</span><span>${mad(prev())}</span></div><div class="line"><b>${t('newt')}</b><b>${mad(prev()+sum())}</b></div>`:'';
  const cartV=()=>`<div class="back" data-a="sheet"></div><div class="sheet" role="dialog" aria-label="${t('yo')}"><h2>${prev()?t('more'):t('yo')}</h2>${S.cart.map((l,x)=>{const d=ldet(l);return`<div class="line"><div><b>${esc(lname(l))}</b>${d?`<small>${esc(d)}</small>`:''}<small>${mad(unit(l))}</small></div><div class="qty"><button data-a="lq" data-v="${x}" data-d="-1" aria-label="−">−</button><b>${l.q}</b><button data-a="lq" data-v="${x}" data-d="1" aria-label="+">+</button></div></div>`}).join('')||`<p class="empty">${t('empty')}</p>`}${prevBox}<label for="on" style="margin-top:14px">${t('onote')}</label><textarea id="on" maxlength="200">${esc(S.onote)}</textarea>${field()}<a id="send" data-a="sent" class="btn ${ok?'':'dis'}" href="${ok?link():'#'}" target="_blank" rel="noopener"><span>${prev()?t('sendadd'):t('send')}</span><span>${mad(sum())}</span></a></div>`;
  const sheet=S.pick?pickV():S.step==='after'?afterV():S.sheet?cartV():'';
  A.innerHTML=head+infoH()+`<div class="chips">${chips}</div><div class="grid">${cards}</div><p class="powered">${t('powered')}</p>${bar}${sheet}`};
 const newPick=it=>({id:it.id,s:(it.sizes||[]).length?0:-1,o:[],e:[],n:'',q:1});
 A.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='lang'){S.lang=v;lss('lg',v)}
  else if(a==='cat')S.cat=v;
  else if(a==='add'){const it=item(v);if(!it||!canOrder(it))return;if(asked()){S.step='after';S.justSent=false}else if(cfgd(it))S.pick=newPick(it);else addLine({id:v,s:-1,o:[],e:[],n:'',q:1})}
  else if(a==='sub'){const k=keyOf({id:v,s:-1,o:[],e:[],n:''}),x=S.cart.findIndex(y=>y.k===k);if(x<0)return;if(--S.cart[x].q<=0)S.cart.splice(x,1);if(!cnt())S.sheet=false}
  else if(a==='lq'){const x=+v,l=S.cart[x];if(!l)return;l.q+=+b.dataset.d;if(l.q<=0)S.cart.splice(x,1);if(!cnt())S.sheet=false}
  else if(a==='psz')S.pick.s=+v;
  else if(a==='pop'||a==='pex'){const arr=a==='pop'?S.pick.o:S.pick.e,k=+v,x=arr.indexOf(k);x<0?arr.push(k):arr.splice(x,1);arr.sort((p,q)=>p-q)}
  else if(a==='pq')S.pick.q=Math.max(1,S.pick.q+ +v);
  else if(a==='padd'){S.pick.n=S.pick.n.trim();addLine(S.pick);S.pick=null}
  else if(a==='pclose')S.pick=null;
  else if(a==='sheet')S.sheet=!S.sheet;
  else if(a==='sent'){
   /* Le lien WhatsApp s'ouvre ; on range ce panier dans la commande en cours et on vide le panier. */
   if(!cnt()||num().length<=6||closed()||noTable(e))return;const d=S.done||{ts:Date.now(),sid:uid(),lines:[],total:0,asked:false};
   post({sid:d.sid,table:S.nm.trim(),note:S.onote.trim(),lines:S.cart.map(l=>({id:l.id,q:l.q,s:l.s,o:l.o,e:l.e,n:l.n}))});
   for(const l of S.cart){const p=unit(l),x=d.lines.find(y=>y.k===l.k&&y.p===p);x?x.q+=l.q:d.lines.push({k:l.k,id:l.id,s:l.s,o:l.o,e:l.e,n:l.n,q:l.q,p})}
   d.total+=sum();S.done=d;S.cart=[];S.onote='';keep();setTimeout(()=>{S.sheet=false;S.step='after';S.justSent=true;draw()},400);return}
  else if(a==='called'){if(!S.pay||num().length<=6||noTable(e))return;post({sid:S.done.sid,table:S.nm.trim(),bill:{pay:S.pay}});setTimeout(()=>{S.done.asked=true;keep();draw()},400);return}
  else if(a==='pay'){S.pay=v;keep()}
  else if(a==='open2'){S.step='after';S.justSent=false}
  else if(a==='more'||a==='close2'){S.step='';S.sheet=false}
  else if(a==='again'){if(!asked())return;S.cart=[];S.step='';S.sheet=false;S.pay='';S.done=null;keep()}
  else if(a==='quit'){if(!asked())return;S.cart=[];S.sheet=false;S.pay='';S.done=null;keep();S.step='bye';scrollTo(0,0)}
  else if(a==='back')S.step='';
  else return;
  draw()};
 A.oninput=e=>{const id=e.target.id;
  if(id==='pn'&&S.pick)S.pick.n=e.target.value;
  else if(id==='on'){S.onote=e.target.value;const a=$('#send');if(a&&!a.classList.contains('dis'))a.href=link()}
  else if(id==='nm'){S.nm=e.target.value;if(S.done)keep();const er=$('#nmerr');if(er&&S.nm.trim())er.textContent='';const a=$('#send');if(a&&!a.classList.contains('dis'))a.href=link();const c=$('#call');if(c&&!c.classList.contains('dis'))c.href=billLink()}};
 /* Changement de jour ou d'ouverture pendant que le menu est ouvert : on met à jour, sauf si le client est en train de remplir une fenêtre. */
 let K=today()+JSON.stringify(ST);setInterval(()=>{const k=today()+JSON.stringify(openStatus(R.hours));if(k===K||S.pick||S.sheet||S.step)return;K=k;S.cart=S.cart.filter(l=>{const i=item(l.id);return i&&avail(i)});draw()},60000);
 draw();
}

P.indexOf('/r/')===0?menuPage(decodeURIComponent(P.split('/')[2])):P==='/admin'?adminPage():P==='/reset'?resetPage():P==='/nouveau-mot-de-passe'?newPwPage():landing();
