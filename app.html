<style>
:root{--bg:#FFF4EA;--sf:#FFFFFF;--tx:#2B1B14;--mu:#6B5649;--pr:#E4572E;--prd:#B8401C;--ac:#F6AE2D;--ln:#EBD9C8;--tint:#FDE3D6;--rd:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Cairo,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.hd{position:sticky;top:0;z-index:5;background:var(--pr);color:var(--bg)}
.hd .in{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{margin:0;font:800 22px/1.2 Georgia,"Times New Roman",Cairo,serif}
.brand p{margin:0;font-size:14px;color:var(--tx)}
.pill{background:var(--bg);border:0;color:var(--tx);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;max-width:720px;margin:0 auto}
.chips button{flex:none;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:8px 18px;font-weight:600}
.chips .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;max-width:720px;margin:0 auto;padding:0 16px 16px}
.powered{text-align:center;color:var(--mu);font-size:14px;margin:0;padding:8px 16px 110px}
.card{border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:var(--sf)}
.card.off{opacity:.55}
.card img,.noimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.noimg{background:var(--tint);color:var(--prd);display:grid;place-items:center;font:800 44px/1 Georgia,"Times New Roman",Cairo,serif}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.cb>b{font-weight:600;line-height:1.3}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cr>span{color:var(--mu);font-weight:600}
.add,.qty button{border:0;border-radius:999px;background:var(--pr);color:var(--tx);font-weight:800}
.add{padding:6px 14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;font-size:18px}
.bar{position:fixed;inset:auto 0 0 0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:14px;padding:14px 18px;background:var(--pr);color:var(--tx);font-weight:800;text-decoration:none}
.btn.dis{background:var(--ln);color:var(--mu);pointer-events:none}
.back{position:fixed;inset:0;z-index:7;background:rgba(43,27,20,.55)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:8;max-height:85%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin:4px 0 12px}
label{display:block;font-weight:600;font-size:14px;color:var(--mu)}
h2{font:700 20px/1.3 Georgia,"Times New Roman",Cairo,serif;margin:0 0 10px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.msg{color:var(--rd);font-size:14px;min-height:20px;margin:0 0 8px}
.note{color:var(--mu);font-size:14px}
.sec{padding:20px 0;border-bottom:1px solid var(--ln)}
.hero{padding-top:28px}
.hero h1{font:800 34px/1.15 Georgia,"Times New Roman",Cairo,serif;margin:0 0 12px}
.hero p{color:var(--mu);margin:0 0 8px}
.logo{display:block;border-radius:28px;margin:0 0 20px}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);font-weight:600}
.tabs .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.arow{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:start}
.th{display:block;cursor:pointer}
.th img,.th .noimg{border-radius:12px;aspect-ratio:1;font-size:30px}
.th small{display:block;text-align:center;color:var(--prd);font-weight:600;font-size:13px}
.th input{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:4px 12px;font-size:14px;margin-inline-end:8px}
.sm.d{color:var(--rd)}
.pay{padding:14px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);font-weight:700}.pay.on{border-color:var(--pr);background:var(--tint)}.btn.alt{background:var(--sf);border:2px solid var(--ln);margin-bottom:10px}
.lnk{background:none;border:0;color:var(--prd);text-decoration:underline;padding:0;font-weight:600;cursor:pointer}
#qr{display:inline-block;padding:10px;background:#fff;border:1px solid var(--ln);border-radius:8px}
</style>
</head>

function landing(){
 if(localStorage.getItem('tk')){location.replace('/admin');return}
 let m='up';
 const draw=()=>{A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<div><h1>Orderely</h1><p>Menu digital</p></div></div></div></div><div class="wrap hero"><img class="logo" src="${LOGO}" width="150" height="150" alt="Orderely, menu digital"><h1>Votre menu en ligne, avec photos, en 5 minutes</h1><p>Vos clients scannent le QR code, choisissent leurs plats et commandent sur WhatsApp. Menu en français et en arabe, prix en dirhams.</p><div class="tabs"><button data-m="up" class="${m==='up'?'on':''}">Créer mon menu</button><button data-m="in" class="${m==='in'?'on':''}">Me connecter</button></div><form id="f">${m==='up'?`<label for="n">Nom du restaurant</label><input id="n" required><label for="s">Votre lien (lettres, chiffres, tirets)</label><input id="s" required><label for="w">Numéro WhatsApp avec indicatif (ex. 212612345678)</label><input id="w" inputmode="numeric" required>`:''}<label for="e">Email</label><input id="e" type="email" required>${m==='fg'?'':`<label for="p">Mot de passe (6 caractères minimum)</label><input id="p" type="password" required>`}<p class="msg" id="m"></p><button class="btn" type="submit"><span>${m==='up'?'Créer mon menu':m==='fg'?'Envoyer le lien':'Me connecter'}</span></button></form>${m==='in'?'<p class="note" style="margin-top:14px"><button type="button" data-m="fg" class="lnk">Mot de passe oublié ?</button></p>':''}</div>`};
 A.onclick=e=>{const b=e.target.closest('[data-m]');if(b){m=b.dataset.m;draw()}};
 A.oninput=e=>{if(e.target.id==='n'&&!$('#s').dataset.m)$('#s').value=slugify(e.target.value);if(e.target.id==='s')e.target.dataset.m=1};
 A.onsubmit=async ev=>{ev.preventDefault();const g=i=>$('#'+i)?$('#'+i).value.trim():'';
  try{if(m==='fg'){await api('/api/forgot','POST',{email:g('e')});$('#m').style.color='var(--prd)';$('#m').textContent='Si un compte existe avec cet email, un lien de réinitialisation vient d’être envoyé. Pensez à vérifier vos courriers indésirables.';return}const r=m==='up'?await api('/api/signup','POST',{name:g('n'),slug:g('s'),wa:g('w'),email:g('e'),password:$('#p').value}):await api('/api/login','POST',{email:g('e'),password:$('#p').value});localStorage.setItem('tk',r.token);location.href='/admin'}
  catch(x){$('#m').textContent={exists:'Cet email ou ce lien est déjà utilisé.',invalid:'Vérifiez les champs (mot de passe : 6 caractères minimum).',login:'Email ou mot de passe incorrect.',many:'Trop de demandes. Réessayez plus tard.'}[x.error]||'Une erreur est survenue. Réessayez.'}};
 draw();
}

/* Réduit la photo à ~100 Ko max : 900 px de large au plus, puis baisse la qualité et la taille jusqu'à passer sous la limite. */
async function resize(file){const im=await createImageBitmap(file);let max=900,q=.82,d='';for(let n=0;n<10;n++){const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if((d.length-23)*.75<=100e3)break;if(q>.6)q-=.08;else max=Math.round(max*.85)}return d}
async function adminPage(){
 let R;try{R=await api('/api/me')}catch(e){localStorage.removeItem('tk');location.replace('/');return}
 const url=location.origin+'/r/'+R.slug,st=t=>{$('#st').textContent=t};
 const save=async()=>{try{R=await api('/api/items','PUT',{items:R.items});st('Enregistré')}catch(e){st('Erreur d’enregistrement')}};
 const row=i=>`<div class="arow"><label class="th">${i.img||i.ph?`<img src="${i.img?'/img/'+i.img:i.ph}" alt="">`:`<div class="noimg">+</div>`}<small>${i.img?'Changer la photo':'Ajouter une photo'}</small><input type="file" accept="image/*" data-id="${i.id}"></label><div><input data-k="fr" data-id="${i.id}" value="${esc(i.fr)}" placeholder="Nom en français"><input data-k="ar" data-id="${i.id}" dir="rtl" value="${esc(i.ar)}" placeholder="الاسم بالعربية"><div class="g2"><input data-k="price" data-id="${i.id}" type="number" min="0" value="${i.price}" aria-label="Prix en MAD"><select data-k="cat" data-id="${i.id}">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===i.cat?'selected':''}>${c[1]}</option>`).join('')}</select></div><button class="sm" data-a="tg" data-id="${i.id}">${i.on?'Disponible':'Épuisé'}</button><button class="sm d" data-a="dl" data-id="${i.id}">Supprimer</button></div></div>`;
 const draw=()=>{A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<div><h1>${esc(R.name)}</h1><p id="st">Gestion</p></div></div><div><a class="pill" href="${url}" target="_blank" rel="noopener">Voir mon menu</a> <button class="pill" data-a="out">Quitter</button></div></div></div><div class="wrap"><div class="sec"><h2>Lien et QR code</h2><p><a href="${url}">${url}</a></p><div id="qr"></div><p class="note">Imprimez ce QR code et posez-le sur les tables.</p></div><div class="sec"><h2>Informations</h2><label for="gn">Nom du restaurant</label><input id="gn" value="${esc(R.name)}"><label for="gw">Numéro WhatsApp avec indicatif</label><input id="gw" inputmode="numeric" value="${esc(R.wa)}"><label for="gi">Instagram du restaurant (@nom ou lien)</label><input id="gi" value="${esc(R.ig||'')}" placeholder="@monrestaurant"><label for="gr">Lien pour laisser un avis (Google)</label><input id="gr" value="${esc(R.review||'')}" placeholder="https://..."><p class="note">Ces deux liens s’affichent au client après sa commande. Laissez vide pour ne pas les afficher.</p></div><div class="sec"><h2>Sauvegarde du menu</h2><p class="note">Téléchargez le menu et les photos dans un fichier seed.json pour pouvoir le restaurer en cas de perte.</p><button class="btn" data-a="exp"><span>Télécharger la sauvegarde</span></button><p class="note" style="margin-top:16px">Pour restaurer, choisissez le fichier seed.json enregistré plus tôt : il remplace le menu actuel, avec les photos.</p><button class="btn alt" data-a="imp"><span>Restaurer une sauvegarde</span></button><input id="imp" type="file" accept=".json,application/json" style="display:none"></div><div class="sec"><h2>Plats</h2><button class="btn" data-a="new"><span>Ajouter un plat</span></button>${R.items.map(row).join('')}</div></div>`;
  try{new QRCode($('#qr'),{text:url,width:160,height:160})}catch(e){}};
 A.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='out'){localStorage.removeItem('tk');location.href='/';return}
  if(a==='imp'){$('#imp').click();return}
  if(a==='exp'){try{const r=await fetch('/api/export',{headers:{Authorization:'Bearer '+localStorage.getItem('tk')}});if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob()),l=document.createElement('a');l.href=u;l.download='seed.json';l.click();URL.revokeObjectURL(u);st('Sauvegarde téléchargée')}catch(x){st('Échec de la sauvegarde')}return}
  if(a==='new')R.items.unshift({id:crypto.randomUUID(),cat:'pla',fr:'',ar:'',price:0,on:true,img:''});
  else if(a==='tg'){const i=R.items.find(x=>x.id===id);i.on=!i.on}
  else if(a==='dl')R.items=R.items.filter(x=>x.id!==id);
  else return;
  await save();draw()};
 A.onchange=async e=>{const t=e.target,id=t.dataset.id;
  if(t.id==='imp'){const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw 0;if(!confirm('Remplacer le menu actuel par cette sauvegarde ('+d.items.length+' plats) ?')){t.value='';return}st('Restauration en cours…');await api('/api/import','POST',d);R=await api('/api/me');draw();st('Menu restauré')}catch(x){t.value='';st('Fichier de sauvegarde invalide')}return}
  if(['gn','gw','gi','gr'].includes(t.id)){try{R=await api('/api/me','PUT',{name:$('#gn').value.trim(),wa:$('#gw').value.trim(),ig:$('#gi').value.trim(),review:$('#gr').value.trim()});$('#gi').value=R.ig||'';$('#gr').value=R.review||'';st('Enregistré')}catch(x){st('Erreur d’enregistrement')}return}
  if(!id)return;const i=R.items.find(x=>x.id===id);
  if(t.type==='file'){if(!t.files[0])return;st('Envoi de la photo…');try{i.img=(await api('/api/photo','POST',{data:await resize(t.files[0])})).img}catch(x){st('Photo refusée');return}}
  else i[t.dataset.k]=t.dataset.k==='price'?Number(t.value)||0:t.value;
  await save();if(t.type==='file')draw()};
 draw();
}

/* ---------- Menu client ---------- */
async function menuPage(slug){
 let R;try{R=await api('/api/menu/'+encodeURIComponent(slug))}catch(e){A.innerHTML='<p class="empty">'+TT.fr.nf+'</p>';return}
 document.title=R.name;R.items=R.items.filter(i=>i.fr||i.ar);
 const S={lang:localStorage.getItem('lg')||'fr',cat:(CATS.find(c=>R.items.some(i=>i.cat===c[0]))||CATS[0])[0],cart:{},sheet:false,nm:'',step:'',pay:'',asked:false};
 const t=k=>TT[S.lang][k],nm=i=>S.lang==='ar'?(i.ar||i.fr):(i.fr||i.ar),mad=n=>S.lang==='ar'?n+' د.م':n+' MAD';
 const cl=()=>R.items.filter(i=>S.cart[i.id]),cnt=()=>cl().reduce((a,i)=>a+S.cart[i.id],0),sum=()=>cl().reduce((a,i)=>a+S.cart[i.id]*i.price,0);
 const num=()=>R.wa.replace(/\D/g,''),link=()=>'https://wa.me/'+num()+'?text='+encodeURIComponent(R.name+'\n'+cl().map(i=>S.cart[i.id]+' × '+nm(i)+' — '+mad(S.cart[i.id]*i.price)).join('\n')+'\n'+t('total')+' : '+mad(sum())+(S.nm?'\n'+t('ml')+' : '+S.nm:''));
 const step=i=>`<div class="qty"><button data-a="sub" data-v="${i.id}" aria-label="−">−</button><b>${S.cart[i.id]}</b><button data-a="add" data-v="${i.id}" aria-label="+">+</button></div>`;
 const billLink=()=>'https://wa.me/'+num()+'?text='+encodeURIComponent(R.name+'\n'+t('billmsg')+'\n'+(S.nm?t('ml')+' : '+S.nm+'\n':'')+t('pay')+' : '+(S.pay==='cb'?t('cbmsg'):t('cashmsg'))+'\n'+t('total')+' : '+mad(sum()));
 const afterV=()=>{
  const okc=S.pay&&num().length>6;
  const pay=`<div class="g2"><button class="pay ${S.pay==='cb'?'on':''}" data-a="pay" data-v="cb">${t('cb')}</button><button class="pay ${S.pay==='cash'?'on':''}" data-a="pay" data-v="cash">${t('cash')}</button></div>`;
  const ask=S.asked?`<p><b>${t('asked')}</b> ${S.pay==='cb'?t('askedcb'):t('askedcash')}</p>`:`${S.pay?'':`<p class="note">${t('pickpay')}</p>`}<a id="call" data-a="called" class="btn ${okc?'':'dis'}" href="${okc?billLink():'#'}" target="_blank" rel="noopener"><span>${t('call')}</span></a>`;
  const links=(R.review?`<a class="btn alt" href="${esc(R.review)}" target="_blank" rel="noopener"><span>${t('review')}</span></a>`:'')+(R.ig?`<a class="btn alt" href="${esc(R.ig)}" target="_blank" rel="noopener"><span>${t('follow')}</span></a>`:'');
  return `<div class="back" data-a="close2"></div><div class="sheet" role="dialog" aria-label="${t('sent')}"><h2>${t('sent')}</h2><p class="note">${t('sentd')}</p><h2 style="margin-top:20px">${t('bill')}</h2><p class="note">${t('billd')}</p>${pay}<label for="nm" style="margin-top:14px">${t('who')}</label><input id="nm" value="${esc(S.nm)}">${ask}<h2 style="margin-top:24px">${t('thanks')}</h2>${links}<button class="btn alt" data-a="again"><span>${t('again')}</span></button></div>`};
 const draw=()=>{
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const chips=CATS.filter(c=>R.items.some(i=>i.cat===c[0])).map(c=>`<button data-a="cat" data-v="${c[0]}" class="${S.cat===c[0]?'on':''}">${S.lang==='ar'?c[2]:c[1]}</button>`).join('');
  const cards=R.items.filter(i=>i.cat===S.cat).map(i=>{const q=S.cart[i.id]||0,ctl=!i.on?`<small>${t('off')}</small>`:q?step(i):`<button class="add" data-a="add" data-v="${i.id}">${t('add')}</button>`;
   return `<article class="card ${i.on?'':'off'}">${i.img||i.ph?`<img src="${i.img?'/img/'+i.img:i.ph}" alt="" loading="lazy">`:`<div class="noimg">${esc([...nm(i)][0]||'?')}</div>`}<div class="cb"><b>${esc(nm(i))}</b><div class="cr"><span>${mad(i.price)}</span>${ctl}</div></div></article>`}).join('');
  const bar=cnt()?`<div class="bar"><button class="btn" data-a="sheet"><span>${t('view')} (${cnt()})</span><span>${mad(sum())}</span></button></div>`:'';
  const ok=num().length>6&&cnt();
  const sheet=S.step==='after'?afterV():S.sheet?`<div class="back" data-a="sheet"></div><div class="sheet" role="dialog" aria-label="${t('yo')}"><h2>${t('yo')}</h2>${cl().map(i=>`<div class="line"><div><b>${esc(nm(i))}</b><br><span class="note">${mad(i.price)}</span></div>${step(i)}</div>`).join('')||`<p class="empty">${t('empty')}</p>`}<label for="nm" style="margin-top:14px">${t('who')}</label><input id="nm" value="${esc(S.nm)}"><a id="send" data-a="sent" class="btn ${ok?'':'dis'}" href="${ok?link():'#'}" target="_blank" rel="noopener"><span>${t('send')}</span><span>${mad(sum())}</span></a></div>`:'';
  A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<div><h1>${esc(R.name)}</h1><p>${t('sub')}</p></div></div><button class="pill" data-a="lang">${S.lang==='fr'?'العربية':'Français'}</button></div></div><div class="chips">${chips}</div><div class="grid">${cards}</div><p class="powered">${S.lang==='ar'?'مدعوم من Orderely':'Propulsé par Orderely'}</p>${bar}${sheet}`};
 A.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='lang'){S.lang=S.lang==='fr'?'ar':'fr';localStorage.setItem('lg',S.lang)}
  else if(a==='cat')S.cat=v;
  else if(a==='add')S.cart[v]=(S.cart[v]||0)+1;
  else if(a==='sub'){S.cart[v]--;if(S.cart[v]<=0)delete S.cart[v];if(!cnt())S.sheet=false}
  else if(a==='sheet')S.sheet=!S.sheet;
  else if(a==='sent'){setTimeout(()=>{S.step='after';draw()},400);return}
  else if(a==='called'){setTimeout(()=>{S.asked=true;draw()},400);return}
  else if(a==='pay')S.pay=v;
  else if(a==='close2'){S.step='';S.sheet=false}
  else if(a==='again'){S.cart={};S.step='';S.sheet=false;S.pay='';S.asked=false}
  else return;
  draw()};
 A.oninput=e=>{if(e.target.id==='nm'){S.nm=e.target.value;const a=$('#send');if(a&&!a.classList.contains('dis'))a.href=link();const c=$('#call');if(c&&!c.classList.contains('dis'))c.href=billLink()}};
 draw();
}

const P=location.pathname.replace(/\/$/,'');
function resetPage(){
 A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<h1>Réinitialiser un mot de passe</h1></div></div></div><div class="wrap hero"><p>Page réservée au prestataire. Entrez la clé administrateur, l’email du restaurant et un nouveau mot de passe à lui communiquer.</p><form id="f"><label for="k">Clé administrateur</label><input id="k" type="password" required><label for="e">Email du restaurant</label><input id="e" type="email" required><label for="p">Nouveau mot de passe (6 caractères minimum)</label><input id="p" type="text" required><p class="msg" id="m"></p><button class="btn" type="submit"><span>Réinitialiser</span></button></form></div>`;
 A.onsubmit=async ev=>{ev.preventDefault();const m=$('#m');try{await api('/api/reset','POST',{adminKey:$('#k').value,email:$('#e').value.trim(),password:$('#p').value});m.style.color='var(--prd)';m.textContent='Mot de passe modifié. Communiquez-le au restaurateur.'}catch(x){m.style.color='';m.textContent={key:'Clé administrateur incorrecte.',none:'Aucun restaurant avec cet email.',many:'Trop d’essais. Réessayez dans 15 minutes.',noadmin:'La clé ADMIN_KEY n’est pas configurée sur le serveur.',invalid:'Mot de passe : 6 caractères minimum.'}[x.error]||'Une erreur est survenue. Réessayez.'}};
}
function newPwPage(){
 const t=new URLSearchParams(location.search).get('t')||'';
 A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<h1>Nouveau mot de passe</h1></div></div></div><div class="wrap hero"><form id="f"><label for="p">Nouveau mot de passe (6 caractères minimum)</label><input id="p" type="password" required autocomplete="new-password"><label for="p2">Confirmer le mot de passe</label><input id="p2" type="password" required autocomplete="new-password"><p class="msg" id="m"></p><button class="btn" type="submit"><span>Enregistrer</span></button></form></div>`;
 A.onsubmit=async ev=>{ev.preventDefault();const m=$('#m');if($('#p').value!==$('#p2').value){m.textContent='Les deux mots de passe ne sont pas identiques.';return}
  try{await api('/api/reset-password','POST',{token:t,password:$('#p').value});$('#f').outerHTML='<p>Votre mot de passe a été modifié.</p><a class="btn" href="/"><span>Se connecter</span></a>'}
  catch(x){m.textContent={invalid:'Mot de passe : 6 caractères minimum.',token:'Ce lien est invalide ou a expiré. Demandez-en un nouveau.',many:'Trop de tentatives. Réessayez plus tard.'}[x.error]||'Une erreur est survenue. Réessayez.'}};
}
P.indexOf('/r/')===0?menuPage(decodeURIComponent(P.split('/')[2])):P==='/admin'?adminPage():P==='/reset'?resetPage():P==='/nouveau-mot-de-passe'?newPwPage():landing();
</script>
