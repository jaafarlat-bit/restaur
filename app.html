<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff;--sf:#f1f3fb;--tx:#16183a;--mu:#585d85;--pr:#2a3fb5;--ac:#f0a92b;--ln:#dde1f1;--rd:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Cairo,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.hd{position:sticky;top:0;z-index:5;background:var(--pr);color:#fff}
.hd .in{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{margin:0;font-size:22px;font-weight:800;line-height:1.2}
.brand p{margin:0;font-size:14px;opacity:.85}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;max-width:720px;margin:0 auto}
.chips button{flex:none;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:8px 18px;font-weight:600}
.chips .on{background:var(--tx);color:#fff;border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;max-width:720px;margin:0 auto;padding:0 16px 120px}
.card{border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.off{opacity:.5}
.card img,.noimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.noimg{background:var(--sf);color:var(--pr);display:grid;place-items:center;font-size:44px;font-weight:800}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.cb>b{font-weight:600;line-height:1.3}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cr>span{color:var(--mu);font-weight:600}
.add,.qty button{border:0;border-radius:999px;background:var(--pr);color:#fff;font-weight:700}
.add{padding:6px 14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;font-size:18px}
.bar{position:fixed;inset:auto 0 0 0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:14px;padding:14px 18px;background:var(--pr);color:#fff;font-weight:800;text-decoration:none}
.btn.dis{background:var(--ln);color:var(--mu);pointer-events:none}
.back{position:fixed;inset:0;z-index:7;background:rgba(10,12,40,.55)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:8;max-height:85%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin:4px 0 12px}
label{display:block;font-weight:600;font-size:14px;color:var(--mu)}
h2{font-size:20px;margin:0 0 10px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.msg{color:var(--rd);font-size:14px;min-height:20px;margin:0 0 8px}
.note{color:var(--mu);font-size:14px}
.sec{padding:20px 0;border-bottom:1px solid var(--ln)}
.hero{padding-top:36px}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 12px;font-weight:800}
.hero p{color:var(--mu);margin:0 0 8px}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);font-weight:600}
.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.arow{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:start}
.th{display:block;cursor:pointer}
.th img,.th .noimg{border-radius:12px;aspect-ratio:1;font-size:30px}
.th small{display:block;text-align:center;color:var(--pr);font-weight:600;font-size:13px}
.th input{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:4px 12px;font-size:14px;margin-inline-end:8px}
.sm.d{color:var(--rd)}
#qr{display:inline-block;padding:10px;background:#fff;border:1px solid var(--ln);border-radius:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['ent','Entrées','المقبلات'],['pla','Plats','الأطباق'],['des','Desserts','الحلويات'],['boi','Boissons','المشروبات']];
const STAR='<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="8" width="24" height="24" fill="#fff"/><rect x="8" y="8" width="24" height="24" fill="#f0a92b" fill-opacity=".9" transform="rotate(45 20 20)"/></svg>';
const api=async(u,m,b)=>{const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.getItem('tk')||'')},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j};
const slugify=v=>v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const TT={fr:{sub:'Choisissez et commandez sur WhatsApp',add:'Ajouter',view:'Voir la commande',total:'Total',send:'Envoyer sur WhatsApp',who:'Votre nom ou numéro de table',empty:'Votre commande est vide.',yo:'Votre commande',off:'Épuisé',ml:'Table / nom',nf:'Ce restaurant n’existe pas.'},
ar:{sub:'اختر أطباقك واطلب عبر واتساب',add:'أضف',view:'عرض الطلب',total:'المجموع',send:'إرسال عبر واتساب',who:'اسمك أو رقم الطاولة',empty:'طلبك فارغ.',yo:'طلبك',off:'غير متوفر',ml:'الطاولة / الاسم',nf:'هذا المطعم غير موجود.'}};

/* ---------- Accueil : création de compte et connexion ---------- */
function landing(){
 if(localStorage.getItem('tk')){location.replace('/admin');return}
 let m='up';
 const draw=()=>{A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<h1>Menu digital</h1></div></div></div><div class="wrap hero"><h1>Votre menu en ligne, avec photos, en 5 minutes</h1><p>Vos clients scannent le QR code, choisissent leurs plats et commandent sur WhatsApp. Menu en français et en arabe, prix en dirhams.</p><div class="tabs"><button data-m="up" class="${m==='up'?'on':''}">Créer mon menu</button><button data-m="in" class="${m==='in'?'on':''}">Me connecter</button></div><form id="f">${m==='up'?`<label for="n">Nom du restaurant</label><input id="n" required><label for="s">Votre lien (lettres, chiffres, tirets)</label><input id="s" required><label for="w">Numéro WhatsApp avec indicatif (ex. 212612345678)</label><input id="w" inputmode="numeric" required>`:''}<label for="e">Email</label><input id="e" type="email" required><label for="p">Mot de passe (6 caractères minimum)</label><input id="p" type="password" required><p class="msg" id="m"></p><button class="btn" type="submit"><span>${m==='up'?'Créer mon menu':'Me connecter'}</span></button></form></div>`};
 A.onclick=e=>{const b=e.target.closest('[data-m]');if(b){m=b.dataset.m;draw()}};
 A.oninput=e=>{if(e.target.id==='n'&&!$('#s').dataset.m)$('#s').value=slugify(e.target.value);if(e.target.id==='s')e.target.dataset.m=1};
 A.onsubmit=async ev=>{ev.preventDefault();const g=i=>$('#'+i)?$('#'+i).value.trim():'';
  try{const r=m==='up'?await api('/api/signup','POST',{name:g('n'),slug:g('s'),wa:g('w'),email:g('e'),password:$('#p').value}):await api('/api/login','POST',{email:g('e'),password:$('#p').value});localStorage.setItem('tk',r.token);location.href='/admin'}
  catch(x){$('#m').textContent={exists:'Cet email ou ce lien est déjà utilisé.',invalid:'Vérifiez les champs (mot de passe : 6 caractères minimum).',login:'Email ou mot de passe incorrect.'}[x.error]||'Une erreur est survenue. Réessayez.'}};
 draw();
}

/* ---------- Gestion du restaurateur ---------- */
async function resize(file){const im=await createImageBitmap(file),k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
async function adminPage(){
 let R;try{R=await api('/api/me')}catch(e){localStorage.removeItem('tk');location.replace('/');return}
 const url=location.origin+'/r/'+R.slug,st=t=>{$('#st').textContent=t};
 const save=async()=>{try{R=await api('/api/items','PUT',{items:R.items});st('Enregistré')}catch(e){st('Erreur d’enregistrement')}};
 const row=i=>`<div class="arow"><label class="th">${i.img?`<img src="/img/${i.img}" alt="">`:`<div class="noimg">+</div>`}<small>${i.img?'Changer la photo':'Ajouter une photo'}</small><input type="file" accept="image/*" data-id="${i.id}"></label><div><input data-k="fr" data-id="${i.id}" value="${esc(i.fr)}" placeholder="Nom en français"><input data-k="ar" data-id="${i.id}" dir="rtl" value="${esc(i.ar)}" placeholder="الاسم بالعربية"><div class="g2"><input data-k="price" data-id="${i.id}" type="number" min="0" value="${i.price}" aria-label="Prix en MAD"><select data-k="cat" data-id="${i.id}">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===i.cat?'selected':''}>${c[1]}</option>`).join('')}</select></div><button class="sm" data-a="tg" data-id="${i.id}">${i.on?'Disponible':'Épuisé'}</button><button class="sm d" data-a="dl" data-id="${i.id}">Supprimer</button></div></div>`;
 const draw=()=>{A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<div><h1>${esc(R.name)}</h1><p id="st">Gestion</p></div></div><div><a class="pill" href="${url}" target="_blank" rel="noopener">Voir mon menu</a> <button class="pill" data-a="out">Quitter</button></div></div></div><div class="wrap"><div class="sec"><h2>Lien et QR code</h2><p><a href="${url}">${url}</a></p><div id="qr"></div><p class="note">Imprimez ce QR code et posez-le sur les tables.</p></div><div class="sec"><h2>Informations</h2><label for="gn">Nom du restaurant</label><input id="gn" value="${esc(R.name)}"><label for="gw">Numéro WhatsApp avec indicatif</label><input id="gw" inputmode="numeric" value="${esc(R.wa)}"></div><div class="sec"><h2>Plats</h2><button class="btn" data-a="new"><span>Ajouter un plat</span></button>${R.items.map(row).join('')}</div></div>`;
  try{new QRCode($('#qr'),{text:url,width:160,height:160})}catch(e){}};
 A.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='out'){localStorage.removeItem('tk');location.href='/';return}
  if(a==='new')R.items.unshift({id:crypto.randomUUID(),cat:'pla',fr:'',ar:'',price:0,on:true,img:''});
  else if(a==='tg'){const i=R.items.find(x=>x.id===id);i.on=!i.on}
  else if(a==='dl')R.items=R.items.filter(x=>x.id!==id);
  else return;
  await save();draw()};
 A.onchange=async e=>{const t=e.target,id=t.dataset.id;
  if(t.id==='gn'||t.id==='gw'){try{R=await api('/api/me','PUT',{name:$('#gn').value.trim(),wa:$('#gw').value.trim()});st('Enregistré')}catch(x){st('Erreur d’enregistrement')}return}
  if(!id)return;const i=R.items.find(x=>x.id===id);
  if(t.type==='file'){if(!t.files[0])return;st('Envoi de la photo…');try{i.img=(await api('/api/photo','POST',{data:await resize(t.files[0])})).img}catch(x){st('Photo refusée');return}}
  else i[t.dataset.k]=t.dataset.k==='price'?Number(t.value)||0:t.value;
  await save();if(t.type==='file')draw()};
 draw();
}

/* ---------- Menu client ---------- */
async function menuPage(slug){
 let R;try{R=await api('/api/menu/'+encodeURIComponent(slug))}catch(e){A.innerHTML='<p class="empty">'+TT.fr.nf+'</p>';return}
 document.title=R.name;R.items=R.items.filter(i=>i.fr||i.ar);
 const S={lang:localStorage.getItem('lg')||'fr',cat:(CATS.find(c=>R.items.some(i=>i.cat===c[0]))||CATS[0])[0],cart:{},sheet:false,nm:''};
 const t=k=>TT[S.lang][k],nm=i=>S.lang==='ar'?(i.ar||i.fr):(i.fr||i.ar),mad=n=>S.lang==='ar'?n+' د.م':n+' MAD';
 const cl=()=>R.items.filter(i=>S.cart[i.id]),cnt=()=>cl().reduce((a,i)=>a+S.cart[i.id],0),sum=()=>cl().reduce((a,i)=>a+S.cart[i.id]*i.price,0);
 const num=()=>R.wa.replace(/\D/g,''),link=()=>'https://wa.me/'+num()+'?text='+encodeURIComponent(R.name+'\n'+cl().map(i=>S.cart[i.id]+' × '+nm(i)+' — '+mad(S.cart[i.id]*i.price)).join('\n')+'\n'+t('total')+' : '+mad(sum())+(S.nm?'\n'+t('ml')+' : '+S.nm:''));
 const step=i=>`<div class="qty"><button data-a="sub" data-v="${i.id}" aria-label="−">−</button><b>${S.cart[i.id]}</b><button data-a="add" data-v="${i.id}" aria-label="+">+</button></div>`;
 const draw=()=>{
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const chips=CATS.filter(c=>R.items.some(i=>i.cat===c[0])).map(c=>`<button data-a="cat" data-v="${c[0]}" class="${S.cat===c[0]?'on':''}">${S.lang==='ar'?c[2]:c[1]}</button>`).join('');
  const cards=R.items.filter(i=>i.cat===S.cat).map(i=>{const q=S.cart[i.id]||0,ctl=!i.on?`<small>${t('off')}</small>`:q?step(i):`<button class="add" data-a="add" data-v="${i.id}">${t('add')}</button>`;
   return `<article class="card ${i.on?'':'off'}">${i.img?`<img src="/img/${i.img}" alt="" loading="lazy">`:`<div class="noimg">${esc([...nm(i)][0]||'?')}</div>`}<div class="cb"><b>${esc(nm(i))}</b><div class="cr"><span>${mad(i.price)}</span>${ctl}</div></div></article>`}).join('');
  const bar=cnt()?`<div class="bar"><button class="btn" data-a="sheet"><span>${t('view')} (${cnt()})</span><span>${mad(sum())}</span></button></div>`:'';
  const ok=num().length>6&&cnt();
  const sheet=S.sheet?`<div class="back" data-a="sheet"></div><div class="sheet" role="dialog" aria-label="${t('yo')}"><h2>${t('yo')}</h2>${cl().map(i=>`<div class="line"><div><b>${esc(nm(i))}</b><br><span class="note">${mad(i.price)}</span></div>${step(i)}</div>`).join('')||`<p class="empty">${t('empty')}</p>`}<label for="nm" style="margin-top:14px">${t('who')}</label><input id="nm" value="${esc(S.nm)}"><a id="send" class="btn ${ok?'':'dis'}" href="${ok?link():'#'}" target="_blank" rel="noopener"><span>${t('send')}</span><span>${mad(sum())}</span></a></div>`:'';
  A.innerHTML=`<div class="hd"><div class="in"><div class="brand">${STAR}<div><h1>${esc(R.name)}</h1><p>${t('sub')}</p></div></div><button class="pill" data-a="lang">${S.lang==='fr'?'العربية':'Français'}</button></div></div><div class="chips">${chips}</div><div class="grid">${cards}</div>${bar}${sheet}`};
 A.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='lang'){S.lang=S.lang==='fr'?'ar':'fr';localStorage.setItem('lg',S.lang)}
  else if(a==='cat')S.cat=v;
  else if(a==='add')S.cart[v]=(S.cart[v]||0)+1;
  else if(a==='sub'){S.cart[v]--;if(S.cart[v]<=0)delete S.cart[v];if(!cnt())S.sheet=false}
  else if(a==='sheet')S.sheet=!S.sheet;
  else return;
  draw()};
 A.oninput=e=>{if(e.target.id==='nm'){S.nm=e.target.value;const a=$('#send');if(a&&!a.classList.contains('dis'))a.href=link()}};
 draw();
}

const P=location.pathname.replace(/\/$/,'');
P.indexOf('/r/')===0?menuPage(decodeURIComponent(P.split('/')[2])):P==='/admin'?adminPage():landing();
</script>
</body>
</html>
